name: Mutation

on:
  workflow_dispatch:
  schedule:
    # semanal, segunda 06:00 UTC — mutação é lenta e não bloqueia PR
    - cron: '0 6 * * 1'

permissions:
  contents: read

jobs:
  pitest:
    name: Testes mutantes (PIT)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Configurar JDK 25
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '25'
          cache: maven

      - name: Mutação nos módulos puros
        # pricing e a máquina de estados são lógica pura: mutar CDI/banco mediria o container.
        run: mvn -B -ntp -Pmutation -Djacoco.skip=true pitest:mutationCoverage

      - name: Publicar relatório
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: pitest-report
          path: target/pit-reports/
          if-no-files-found: ignore
