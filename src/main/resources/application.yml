quarkus:
  # Contrato publicado em /q/openapi (json ou yaml)
  smallrye-openapi:
    info-title: Testecvc Hotel Booking API
    info-version: 1.0.0
    info-description: Consulta de hoteis, disponibilidade e reservas com JWT.

  rest-client:
    # contrato v1: cotacao usada pela reserva (repo testecvc-broker-quarkus)
    "broker-v1":
      url: ${BROKER_V1_URL:http://localhost:8081}
      connect-timeout: 2000
      read-timeout: 5000

  # Postgres real também em dev/test (ADR-001). Sem URL configurada, o Dev Services
  # sobe um container automaticamente; em produção a URL vem de variáveis de ambiente.
  datasource:
    db-kind: postgresql
    devservices:
      image-name: postgres:16-alpine

  # O schema é versionado por Flyway; o Hibernate nunca o altera.
  # (quarkus.hibernate-orm.database.generation foi deprecated na 3.40)
  hibernate-orm:
    schema-management:
      strategy: none
    # Colunas jsonb são mapeadas pelo Jackson compartilhado com o REST. O Quarkus falha
    # por padrão nesse caso ("uses Quarkus' main formatting facilities"); aqui optamos
    # conscientemente por permitir, já que é o mesmo ObjectMapper da aplicação.
    # Valores possíveis: warn | fail | ignore.
    mapping:
      format:
        global: ignore

  flyway:
    migrate-at-start: true

booking:
  # Moeda do snapshot de preço
  currency: BRL
  # Capacidade por quarto/noite ao materializar o inventário (premissa, ver ADR-002)
  default-capacity: 1
  # Período máximo de uma estadia, em noites. Limite único: reserva, criação e inventário
  # leem daqui. Sobrescreve por ambiente com BOOKING_MAX_NIGHTS.
  max-nights: ${BOOKING_MAX_NIGHTS:30}
  # Taxa em basis points (1176 = 11,76%) — decisão de produto registrada no ADR-004:
  # markup ao hóspede, incidindo sobre adulto e criança, fixo para todas as reservas.
  fee-bps: 1176

jwt:
  expiration: 86400000
  issuer: testecvc

smallrye:
  jwt:
    sign:
      key:
        # Chave privada fora do repositório. Em dev, gere com ./generate_jwtkeys.sh;
        # em produção, aponte para o arquivo montado a partir do secret manager.
        location: ${JWT_SIGN_KEY_LOCATION:jwt/privateKey.pem}

mp:
  jwt:
    verify:
      issuer: testecvc
      publickey:
        location: ${JWT_VERIFY_KEY_LOCATION:jwt/publicKey.pem}

# Identidade agora vive no banco (migração V4). O seeder de desenvolvimento só existe
# em dev/test; em produção o provisionamento vem de fora.
"%dev":
  app:
    seed-user:
      enabled: true
      username: usuario
      password: senha

