quarkus:
  test:
    profile: test

# Par de chaves exclusivo dos testes (versionado de propósito — ver jwt/README.md).
# Mantém a suíte hermética: não depende das chaves de dev, que não estão no repositório.
smallrye:
  jwt:
    sign:
      key:
        location: jwt/private.pem

mp:
  jwt:
    verify:
      issuer: testecvc
      publickey:
        location: jwt/public.pem

# Taxa usada nos testes (700 = 7,00%, o mesmo valor de dev). Os testes verificam a
# fórmula contra este valor, não o valor como regra de negócio (ver ADR-004).
booking:
  fee-bps: 700

usuario:
  login: "usuario"
  passwd: "senha"
